phase1:
  - cmd: "$SIMULATOR_ROOT/dependencies/snipersim/run-sniper"
    args: ["-n", "9", "--", "$BENCHMARK_ROOT/bin/cpu"]
    log: "cpu.log"
    is_to_stdout: false
    clock_rate: 0
  - cmd: "$BENCHMARK_ROOT/bin/asic"
    args: []
    log: ""
    is_to_stdout: false
    clock_rate: 0

phase2:
  - cmd: "$SIMULATOR_ROOT/dependencies/popnet_chiplet/build/popnet"
    args: ["-A", "9", "-c", "1", "-R", "4",
           "-G", "$SIMULATOR_ROOT/benchmark/gemm_2dmesh/topology/2dmesh.gv",
           "-F", "2", "-I", "../bench.txt", "-D", "../delayInfo.txt",
           "-V", "3", "-B", "12", "-O", "12", "-L", "1000",
           "-T", "1000000000", "-r", "1", "-P"]
    log: "popnet.log"
    is_to_stdout: false
    clock_rate: 1