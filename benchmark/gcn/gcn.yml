# gcn heterogeneous chiplet simulation
# - CPU/IO: gem5 SE mode (RISC-V) via chiplet_se.py
# - CPU/IO intra NoC: Ruby + Garnet + ChipletMesh (256-bit links)
# - CPU role maps target 128KB/256KB/4MB hierarchy onto available Ruby levels
# - IO role uses Ruby/Garnet + dual-directory approximation for dual-channel DDR,
#   while the benchmark timing model retains the 2MB system LLC behavior
# - PIM: native analytic backend
# - phase2: inter-chiplet-only PopNet replay using online bench.txt
#   and direct PopNet invocation, consistent with artifact/matmul

phase1:
  - cmd: "$SIMULATOR_ROOT/gem5/build/RISCV/gem5.opt"
    args:
      [
        "$SIMULATOR_ROOT/gem5/configs/deprecated/example/chiplet_se.py",
        "--cpu-type",
        "RiscvChipletO3CPU",
        "--chiplet-role",
        "cpu",
        "--sys-clock=800MHz",
        "--cpu-clock=800MHz",
        "--num-cpus=4",
        "--ruby",
        "--ruby-clock=800MHz",
        "--num-dirs=4",
        "--network=garnet",
        "--topology=ChipletMesh",
        "--mesh-rows=2",
        "--mesh-routers=4",
        "--link-width-bits=256",
        "--routing-algorithm=1",
        "--router-latency=2",
        "--link-latency=1",
        "--param",
        "system.cpu[0:4].fetchWidth=4",
        "--param",
        "system.cpu[0:4].decodeWidth=4",
        "--param",
        "system.cpu[0:4].renameWidth=4",
        "--param",
        "system.cpu[0:4].dispatchWidth=4",
        "--param",
        "system.cpu[0:4].issueWidth=4",
        "--param",
        "system.cpu[0:4].commitWidth=4",
        "--param",
        "system.cpu[0:4].isa[0].enable_rvv=True",
        "--param",
        "system.cpu[0:4].isa[0].vlen=256",
        "--cmd",
        "$BENCHMARK_ROOT/bin/cpu",
        "-o",
        "0 0 softmax",
      ]
    log: "gem5.cpu.0.0.log"
    is_to_stdout: false
    clock_rate: 800

  - cmd: "bash"
    args:
      [
        "$BENCHMARK_ROOT/run_pim_backend.sh",
        "0",
        "1",
        "$BENCHMARK_ROOT/reports/pim_pe_workload.txt",
        "$BENCHMARK_ROOT/reports/runtime_plan_pim.txt",
        "$BENCHMARK_ROOT/reports/pim_intra_delay_profile.txt",
      ]
    log: "pim.backend.0.1.log"
    is_to_stdout: false
    clock_rate: 500

  - cmd: "$SIMULATOR_ROOT/gem5/build/RISCV/gem5.opt"
    args:
      [
        "$SIMULATOR_ROOT/gem5/configs/deprecated/example/chiplet_se.py",
        "--cpu-type",
        "RiscvChipletO3CPU",
        "--chiplet-role",
        "io",
        "--ruby",
        "--ruby-clock=800MHz",
        "--sys-clock=800MHz",
        "--cpu-clock=800MHz",
        "--num-cpus=1",
        "--num-dirs=2",
        "--mem-channels=2",
        "--network=garnet",
        "--topology=ChipletMesh",
        "--mesh-rows=2",
        "--mesh-routers=4",
        "--link-width-bits=256",
        "--routing-algorithm=1",
        "--router-latency=2",
        "--link-latency=1",
        "--param",
        "system.cpu[0].isa[0].enable_rvv=True",
        "--param",
        "system.cpu[0].isa[0].vlen=256",
        "--cmd",
        "$BENCHMARK_ROOT/bin/io",
        "-o",
        "1 0 $BENCHMARK_ROOT/reports/runtime_plan_io.txt",
      ]
    log: "gem5.io.1.0.log"
    is_to_stdout: false
    clock_rate: 800

phase2:
  - cmd: "$SIMULATOR_ROOT/popnet_chiplet/build/popnet"
    args:
      [
        "-A",
        "4",
        "-c",
        "1",
        "-V",
        "3",
        "-B",
        "12",
        "-O",
        "12",
        "-F",
        "4",
        "-L",
        "1000",
        "-T",
        "1000000000",
        "-r",
        "1",
        "-I",
        "../bench.txt",
        "-R",
        "4",
        "-G",
        "../topology/mesh_2_2.gv",
        "-D",
        "../delayInfo.txt",
        "-P",
      ]
    log: "popnet_phase2.log"
    is_to_stdout: false
    clock_rate: 1

bench_file: "./bench.txt"
delayinfo_file: "./delayInfo.txt"

